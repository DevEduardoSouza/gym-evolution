<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Evolução Corporal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <link rel="stylesheet" href="style.css">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Gym Evolution</h1>
      <p class="login-subtitle">Acompanhamento de Evolução Corporal</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <p id="login-error" class="login-error" style="display:none;"></p>
        <button type="submit" class="btn-primary login-btn">Entrar</button>
        <p class="login-switch">Não tem conta? <a href="#" id="show-register">Criar conta</a></p>
      </form>

      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label for="reg-username">Usuário</label>
          <input type="text" id="reg-username" autocomplete="username" required
                 minlength="3" maxlength="20" pattern="[a-zA-Z0-9._-]{3,20}"
                 title="3 a 20 caracteres: letras, números, ponto, hífen ou underline">
        </div>
        <div class="form-group">
          <label for="reg-password">Senha</label>
          <input type="password" id="reg-password" autocomplete="new-password" required minlength="4">
        </div>
        <div class="form-group">
          <label for="reg-password2">Confirmar senha</label>
          <input type="password" id="reg-password2" autocomplete="new-password" required minlength="4">
        </div>
        <p id="register-error" class="login-error" style="display:none;"></p>
        <button type="submit" class="btn-primary login-btn">Criar conta</button>
        <p class="login-switch">Já tem conta? <a href="#" id="show-login">Entrar</a></p>
      </form>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      loginForm.style.display = 'none';
      registerForm.style.display = '';
      document.getElementById('reg-username').focus();
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      registerForm.style.display = 'none';
      loginForm.style.display = '';
      document.getElementById('username').focus();
    });

    async function submitAuth(url, body, errorEl) {
      errorEl.style.display = 'none';
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (res.ok) {
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        errorEl.textContent = data.error || 'Erro inesperado';
        errorEl.style.display = 'block';
      } catch {
        errorEl.textContent = 'Erro de conexão';
        errorEl.style.display = 'block';
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      submitAuth('/api/login', {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }, document.getElementById('login-error'));
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('register-error');
      const password = document.getElementById('reg-password').value;
      const password2 = document.getElementById('reg-password2').value;
      if (password !== password2) {
        errorEl.textContent = 'As senhas não coincidem';
        errorEl.style.display = 'block';
        return;
      }
      submitAuth('/api/register', {
        username: document.getElementById('reg-username').value,
        password,
      }, errorEl);
    });
  </script>
</body>
</html>
