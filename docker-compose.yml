services:
  app:
    build: .
    container_name: gym_app
    restart: unless-stopped
    ports:
      - "${GYM_PORT:-3003}:3000"
    environment:
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-gym-evolution-secret-change-me}
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - FATSECRET_CONSUMER_KEY=${FATSECRET_CONSUMER_KEY:-}
      - FATSECRET_CONSUMER_SECRET=${FATSECRET_CONSUMER_SECRET:-}
    volumes:
      - gym_data:/app/data

volumes:
  gym_data:
